services:
  master-template:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=registry
    image: master-template:latest
    container_name: master-template
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    # Security: read-only filesystem with tmpfs for runtime needs
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    # Drop all capabilities, then add back only NET_BIND_SERVICE if needed
    cap_drop:
      - ALL
    # Only needed if binding to ports < 1024; port 3000 doesn't require this
    # cap_add:
    #   - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Health check integrated with Next.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode); });",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Resource limits optimized for Next.js
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    # Graceful restart policy
    restart: unless-stopped
    # Logging configuration (prevent log bloat)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Remove .npmrc after build to avoid secrets exposure (buildkit only)
    # Use BuildKit: DOCKER_BUILDKIT=1 docker build .
